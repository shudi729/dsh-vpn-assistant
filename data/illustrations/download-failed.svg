<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">下载失败排查</title><desc id="desc">原创中性操作示意，非官方客户端截图。核对网络与官方域名；确认磁盘空间和浏览器提示；重试官方渠道，勿换第三方下载站</desc><rect width="760" height="330" rx="20" fill="#142238"/><text x="30" y="44" fill="#eef5ff" font-size="24" font-family="sans-serif">下载失败排查</text><text x="30" y="75" fill="#a8c5e9" font-size="14" font-family="sans-serif">通用操作示意 · 以官方说明和实际界面为准</text><rect x="25" y="102" width="710" height="52" rx="10" fill="#213754"/><circle cx="52" cy="128" r="17" fill="#397ce8"/><text x="47" y="134" fill="white" font-size="18" font-family="sans-serif">1</text><text x="84" y="135" fill="#eef5ff" font-size="18" font-family="sans-serif">核对网络与官方域名</text><rect x="25" y="164" width="710" height="52" rx="10" fill="#213754"/><circle cx="52" cy="190" r="17" fill="#397ce8"/><text x="47" y="196" fill="white" font-size="18" font-family="sans-serif">2</text><text x="84" y="197" fill="#eef5ff" font-size="18" font-family="sans-serif">确认磁盘空间和浏览器提示</text><rect x="25" y="226" width="710" height="52" rx="10" fill="#213754"/><circle cx="52" cy="252" r="17" fill="#397ce8"/><text x="47" y="258" fill="white" font-size="18" font-family="sans-serif">3</text><text x="84" y="259" fill="#eef5ff" font-size="18" font-family="sans-serif">重试官方渠道，勿换第三方下载站</text></svg>